<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пример страницы с footer</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    main {
      min-height: calc(100vh - 100px); /* Высота без учёта футера */
      padding: 20px;
    }
    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .footer-links a {
      color: #ddd;
      margin: 0 10px;
      text-decoration: none;
    }
    .footer-links a:hover {
      color: white;
    }
  </style>
</head>
<body>
  <main>
    <h1>Добро пожаловать на мой сайт</h1>
    <p>Это основное содержимое страницы.</p>
  </main>

  <footer>
    <div class="footer-links">
      <a href="/about">О нас</a>
      <a href="/services">Услуги</a>
      <a href="/blog">Блог</a>
      <a href="/contacts">Контакты</a>
    </div>
    <p>
      <a href="mailto:info@example.com">info@example.com</a> |
      +7 (999) 123-45-67
    </p>
    <p>© 2024 Мой сайт. Все права защищены.</p>
  </footer>
</body>
</html>
