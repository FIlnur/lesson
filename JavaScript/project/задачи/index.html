<!-- Начиная со страницы с единственным div элементом

 1) Черный вертикальный блок
 2) 3 круглых элемента расположенных друг за другом вертикально,

<html lang="en">
<head>

    <script defer src="index.js"></script>
    <style>
        .container {
            display: Flex;
            justify-content: center;

            height: 130px;
            border-radius: 50%;
