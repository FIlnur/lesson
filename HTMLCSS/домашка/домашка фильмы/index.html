<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отзывы о фильмах</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Отзывы о фильмах</h1>
    </header>
    <main class="reviews-container">
        <article class="review-card">
            <h3>Мария Кузнецова</h3>
            <p>«Интерстеллар» — шедевр научной фантастики с глубоким философским подтекстом.</p>
        </article>

        <article class="review-card">
            <h3>Дмитрий Смирнов</h3>
            <p>«Начало» — гениальный фильм, который переворачивает представление о реальности.</p>
        </article>

        <article class="review-card">
            <h3>Елена Морозова</h3>
            <p>«Дюна» — визуальное чудо с потрясающей атмосферой и эпическим сюжетом.</p>
        </article>
    </main>
</body>
</html>
